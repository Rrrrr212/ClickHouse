# ClickHouse Community Configuration
# Centralized configuration for all community channels and social media links.
# This file is the single source of truth for community entries used across
# the README, documentation, and other marketing materials.
#
# Structure:
#   - Each category represents a group of related community channels
#   - Each entry has: name, url, description, icon, and optional tags
#
# Usage:
#   python3 tools/community/generate_community_links.py --format readme
#   python3 tools/community/generate_community_links.py --format html
#   python3 tools/community/generate_community_links.py --validate

version: 1
last_updated: "2026-06-02"

categories:
