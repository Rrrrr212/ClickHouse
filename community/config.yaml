release:
  next:
    version: "26.5"
    date: "2026-05-21"
    event_url: "https://clickhouse.com/company/events/v26-5-community-release-call"
  schedule:
    - version: "26.6"
      date: "2026-06-18"
    - version: "26.7"
      date: "2026-07-16"

install:
  channels:
    - name: "stable"
      description: "Latest stable release recommended for production"
      url_template: "https://builds.clickhouse.com/stable/{platform}/clickhouse"
    - name: "lts"
      description: "Long-term support release for maximum stability"
      url_template: "https://builds.clickhouse.com/lts/{platform}/clickhouse"
    - name: "testing"
      description: "Latest build from master branch (may be unstable)"
      url_template: "https://builds.clickhouse.com/master/{platform}/clickhouse"
